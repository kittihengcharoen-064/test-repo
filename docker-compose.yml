services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app_service

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
      args:
        PORT: "${BACKEND_PORT}"
    container_name: backend-service
    ports:
      - "${BACKEND_PORT}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - database
    networks:
      - app_service

  database:
    image: mysql:8.0
    container_name: db-service
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    networks:
      - app_service

networks:
  app_service:
    driver: bridge

volumes:
  mysql_data: